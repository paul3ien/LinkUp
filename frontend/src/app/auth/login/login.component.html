<!-- T052: Login page with Tailwind styling -->
<div class="min-h-screen bg-gray-100 flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold text-center text-primary mb-6">LinkUp</h1>
    <h2 class="text-lg font-semibold text-gray-700 mb-4 text-center">Connexion</h2>

    <form (ngSubmit)="onSubmit()" #f="ngForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1" for="email">Email</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
          placeholder="vous@exemple.com" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1" for="password">Mot de passe</label>
        <input id="password" type="password" name="password" [(ngModel)]="password" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
          placeholder="••••••••" />
      </div>

      <div *ngIf="error" class="text-red-500 text-sm text-center">{{ error }}</div>

      <button type="submit" [disabled]="loading"
        class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-2 rounded-lg transition disabled:opacity-50">
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>
  </div>
</div>
