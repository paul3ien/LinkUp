<div class="flex flex-col gap-8 p-8 max-w-lg">

  <!-- Greeting -->
  <div>
    <h1 class="text-2xl font-bold text-gray-800">Bonjour, <span class="text-primary">{{ username() }}</span> 👋</h1>
    <p class="text-sm text-gray-400 mt-1">{{ email() }}</p>
  </div>

  <!-- Change pseudo -->
  <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
    <h2 class="text-base font-semibold text-gray-700 mb-4">Changer de pseudo</h2>
    <div class="flex gap-2">
      <input [(ngModel)]="newUsername"
             placeholder="Nouveau pseudo…"
             maxlength="50"
             class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
      <button (click)="saveUsername()"
              [disabled]="!newUsername.trim() || usernameLoading"
              class="bg-primary hover:bg-primary-dark text-white px-4 rounded-lg text-sm font-medium transition disabled:opacity-40">
        {{ usernameLoading ? '…' : 'Valider' }}
      </button>
    </div>
    @if (usernameMsg) {
      <p class="text-sm text-green-600 mt-2">{{ usernameMsg }}</p>
    }
    @if (usernameError) {
      <p class="text-sm text-red-500 mt-2">{{ usernameError }}</p>
    }
  </section>

  <!-- Change password -->
  <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
    <h2 class="text-base font-semibold text-gray-700 mb-4">Changer de mot de passe</h2>
    <div class="flex flex-col gap-3">
      <input [(ngModel)]="currentPassword" type="password"
             placeholder="Mot de passe actuel"
             class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
      <input [(ngModel)]="newPassword" type="password"
             placeholder="Nouveau mot de passe (min 6 car.)"
             class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
      <input [(ngModel)]="confirmPassword" type="password"
             placeholder="Confirmer le nouveau mot de passe"
             class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
      <button (click)="savePassword()"
              [disabled]="!currentPassword || !newPassword || passwordLoading"
              class="bg-primary hover:bg-primary-dark text-white py-2 rounded-lg text-sm font-medium transition disabled:opacity-40">
        {{ passwordLoading ? '…' : 'Mettre à jour' }}
      </button>
    </div>
    @if (passwordMsg) {
      <p class="text-sm text-green-600 mt-2">{{ passwordMsg }}</p>
    }
    @if (passwordError) {
      <p class="text-sm text-red-500 mt-2">{{ passwordError }}</p>
    }
  </section>

  <!-- Logout -->
  <button (click)="logout()"
          class="text-sm text-gray-400 hover:text-red-500 transition text-left">
    Se déconnecter
  </button>

</div>
